<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <title>UNKNOWN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="phone" class="phone">
    <section id="lockScreen" class="screen lock-screen">
      <div class="lock-wallpaper"></div>
      <div class="statusbar"><span id="lockSignal">▮▮▮</span><span>UNKNOWN</span><span>▰</span></div>
      <div class="lock-content">
        <div id="lockTime" class="lock-time">00:00</div>
        <div id="lockDate" class="lock-date">quinta-feira, 1 de outubro</div>
      </div>
      <div class="lock-bottom">
        <button class="round-action" aria-label="Câmera" data-action="camera">⌁</button>
        <div class="swipe-area">
          <div class="swipe-line"></div>
          <span>deslize para abrir</span>
        </div>
        <button class="round-action" aria-label="Lanterna" data-action="flash">◉</button>
      </div>
    </section>

    <section id="homeScreen" class="screen home-screen hidden">
      <div class="wallpaper"></div>
      <div class="statusbar home-status"><span id="homeTime">00:00</span><span>5G</span><span>▰ 87%</span></div>
      <div class="home-content">
        <div class="widget">
          <div class="widget-label">QUINTA-FEIRA</div>
          <div id="homeDate" class="widget-date">01 OUT</div>
          <div class="widget-sub">Tudo parece normal.</div>
        </div>
        <div id="appGrid" class="app-grid">
          <button class="app" data-app="messages"><span class="app-icon messages">✉</span><b>Mensagens</b></button>
          <button class="app" data-app="phone"><span class="app-icon phone">⌕</span><b>Telefone</b></button>
          <button class="app" data-app="gallery"><span class="app-icon gallery">▧</span><b>Galeria</b></button>
          <button class="app" data-app="files"><span class="app-icon files">□</span><b>Arquivos</b></button>
          <button class="app" data-app="browser"><span class="app-icon browser">◎</span><b>Navegador</b></button>
          <button class="app" data-app="email"><span class="app-icon email">@</span><b>E-mail</b></button>
          <button class="app" data-app="settings"><span class="app-icon settings">⚙</span><b>Ajustes</b></button>
          <button class="app" data-app="notes"><span class="app-icon notes">▤</span><b>Notas</b></button>
        </div>
      </div>
      <nav class="dock">
        <button class="dock-app" data-app="phone">⌕</button>
        <button class="dock-app" data-app="messages">✉</button>
        <button class="dock-app" data-app="browser">◎</button>
        <button class="dock-app" data-app="camera">▣</button>
      </nav>
    </section>

    <section id="appScreen" class="screen app-screen hidden">
      <header class="app-header">
        <button id="backButton" class="back-button">‹</button>
        <div><strong id="appTitle">Aplicativo</strong><small id="appSubtitle"></small></div>
        <button id="appMenu" class="header-menu">⋯</button>
      </header>
      <div id="appBody" class="app-body"></div>
      <nav class="system-nav"><button id="navHome">●</button><button id="navBack">‹</button></nav>
    </section>

    <button id="notification" class="notification hidden" aria-label="Abrir notificação">
      <span class="notification-icon">✉</span>
      <span class="notification-text"><b id="notificationTitle">Mensagens</b><small id="notificationBody"></small></span>
      <span class="notification-time">agora</span>
    </button>
    <div id="toast" class="toast"></div>
    <div id="flashOverlay" class="flash-overlay"></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
